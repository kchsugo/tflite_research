<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420"><rect width="820" height="420" fill="white"/><text x="20.0" y="28.0" font-family="Segoe UI,Arial" font-size="15" text-anchor="start" fill="#222" font-weight="bold">[U5] 스케줄링 구조 (예: N=50 #3, 38 GPU / 12 CPU, 분할 0)</text><text x="20.0" y="47.0" font-family="Segoe UI,Arial" font-size="11" text-anchor="start" fill="#555" font-weight="normal">GPU=메인 1레인 직렬,  CPU=P-1(=5)코어 병렬(1코어는 GPU 구동 예약).  각 task=통짜(안 쪼갬).</text><text x="20.0" y="94.0" font-family="Segoe UI,Arial" font-size="12" text-anchor="start" fill="#2E7D32" font-weight="bold">GPU</text><text x="20.0" y="110.0" font-family="Segoe UI,Arial" font-size="9" text-anchor="start" fill="#777" font-weight="normal">(직렬)</text><rect x="110.0" y="80.0" width="650.0" height="26.0" fill="#2E7D32" opacity="0.85"/><text x="435.0" y="97.0" font-family="Segoe UI,Arial" font-size="11" text-anchor="middle" fill="white" font-weight="bold">통짜-GPU task 38개 (직렬 실행)</text><text x="766.0" y="97.0" font-family="Segoe UI,Arial" font-size="10" text-anchor="start" fill="#2E7D32" font-weight="normal">537ms</text><text x="20.0" y="146.0" font-family="Segoe UI,Arial" font-size="11" text-anchor="start" fill="#2E5FA0" font-weight="normal">CPU1</text><rect x="110.0" y="130.0" width="433.7" height="26.0" fill="#2E5FA0" opacity="0.8"/><text x="326.8" y="147.0" font-family="Segoe UI,Arial" font-size="10" text-anchor="middle" fill="white" font-weight="normal">통짜-CPU 3개</text><text x="20.0" y="186.0" font-family="Segoe UI,Arial" font-size="11" text-anchor="start" fill="#2E5FA0" font-weight="normal">CPU2</text><rect x="110.0" y="170.0" width="433.7" height="26.0" fill="#2E5FA0" opacity="0.8"/><text x="326.8" y="187.0" font-family="Segoe UI,Arial" font-size="10" text-anchor="middle" fill="white" font-weight="normal">통짜-CPU 3개</text><text x="20.0" y="226.0" font-family="Segoe UI,Arial" font-size="11" text-anchor="start" fill="#2E5FA0" font-weight="normal">CPU3</text><rect x="110.0" y="210.0" width="433.7" height="26.0" fill="#2E5FA0" opacity="0.8"/><text x="326.8" y="227.0" font-family="Segoe UI,Arial" font-size="10" text-anchor="middle" fill="white" font-weight="normal">통짜-CPU 2개</text><text x="20.0" y="266.0" font-family="Segoe UI,Arial" font-size="11" text-anchor="start" fill="#2E5FA0" font-weight="normal">CPU4</text><rect x="110.0" y="250.0" width="433.7" height="26.0" fill="#2E5FA0" opacity="0.8"/><text x="326.8" y="267.0" font-family="Segoe UI,Arial" font-size="10" text-anchor="middle" fill="white" font-weight="normal">통짜-CPU 2개</text><text x="20.0" y="306.0" font-family="Segoe UI,Arial" font-size="11" text-anchor="start" fill="#2E5FA0" font-weight="normal">CPU5</text><rect x="110.0" y="290.0" width="433.7" height="26.0" fill="#2E5FA0" opacity="0.8"/><text x="326.8" y="307.0" font-family="Segoe UI,Arial" font-size="10" text-anchor="middle" fill="white" font-weight="normal">통짜-CPU 2개</text><text x="549.7" y="146.0" font-family="Segoe UI,Arial" font-size="10" text-anchor="start" fill="#2E5FA0" font-weight="normal">358ms</text><line x1="760.0" y1="70.0" x2="760.0" y2="340.0" stroke="#C00000" stroke-width="1.5" stroke-dasharray="4"/><text x="764.0" y="335.0" font-family="Segoe UI,Arial" font-size="10" text-anchor="start" fill="#C00000" font-weight="normal">makespan=537ms = max(GPU측,CPU측)</text><text x="20.0" y="375.0" font-family="Segoe UI,Arial" font-size="11" text-anchor="start" fill="#7B4EA8" font-weight="normal">● 분할(SPLIT) 없음 — 모든 task는 통짜로 GPU 또는 CPU에 통째 배정</text><text x="20.0" y="393.0" font-family="Segoe UI,Arial" font-size="11" text-anchor="start" fill="#555" font-weight="normal">● CPU측(358) < GPU측(537) → CPU가 병목 안 됨 → GPU 병목을 덜어 1.12x</text></svg>